<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stardew Gift Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a1a2e;
    --panel: #16213e;
    --card: #0f3460;
    --accent: #e94560;
    --gold: #f5c842;
    --green: #4caf50;
    --blue: #5bc0eb;
    --purple: #9b5de5;
    --pink: #f15bb5;
    --muted: #8899aa;
    --text: #e8e8f0;
    --textdim: #aabbcc;
    --border: #2a3a5e;
    --love: #ff6b9d;
    --like: #ffd166;
    --neutral: #6c757d;
    --dislike: #a0522d;
    --hate: #c0392b;
    --removed: #2a2a4a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  header {
    text-align: center;
    padding: 1.2rem 1rem 0.8rem;
    border-bottom: 2px solid var(--gold);
    background: #12122a;
    position: relative;
  }

  header h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(0.7rem, 2vw, 1rem);
    color: var(--gold);
    text-shadow: 3px 3px 0 #7a6010, 0 0 20px #f5c84244;
    letter-spacing: 2px;
    line-height: 1.6;
  }

  header p {
    font-size: 0.82rem;
    color: var(--muted);
    margin-top: 0.4rem;
    font-style: italic;
  }

  .stars {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 1.6rem;
  }
  .stars-left { left: 1.5rem; }
  .stars-right { right: 1.5rem; }

  .layout {
    display: grid;
    grid-template-columns: 240px 1fr 240px;
    gap: 0;
    height: calc(100vh - 90px);
  }

  .panel {
    background: var(--panel);
    border-right: 2px solid var(--border);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  .panel:last-child {
    border-right: none;
    border-left: 2px solid var(--border);
  }

  .panel-header {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.52rem;
    color: var(--gold);
    padding: 0.7rem 0.8rem 0.5rem;
    border-bottom: 1px solid var(--border);
    background: #12122a;
    position: sticky;
    top: 0;
    z-index: 10;
    letter-spacing: 1px;
  }

  .panel-hint {
    font-family: 'Nunito', sans-serif;
    font-size: 0.7rem;
    color: var(--muted);
    font-weight: 400;
    margin-top: 3px;
    letter-spacing: 0;
    font-style: italic;
  }

  .search-wrap {
    padding: 0.5rem 0.6rem;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 52px;
    background: var(--panel);
    z-index: 9;
  }

  .search-wrap input {
    width: 100%;
    background: #0a0a1f;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    font-size: 0.78rem;
    padding: 0.35rem 0.5rem;
    outline: none;
  }
  .search-wrap input:focus { border-color: var(--gold); }
  .search-wrap input::placeholder { color: var(--muted); }

  .item-list, .villager-list {
    flex: 1;
    overflow-y: auto;
    padding: 0.4rem;
  }

  .item-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    font-size: 0.76rem;
    padding: 0.3rem 0.5rem;
    margin-bottom: 3px;
    cursor: pointer;
    transition: all 0.12s;
    position: relative;
  }

  .item-btn:hover { border-color: var(--gold); background: #1a3060; }

  .item-btn.removed {
    background: var(--removed);
    border-color: #33334a;
    color: #4a4a6a;
    text-decoration: line-through;
  }

  .item-btn .item-emoji {
    margin-right: 4px;
  }

  .item-cat {
    font-size: 0.6rem;
    color: var(--muted);
    font-family: 'Press Start 2P', monospace;
    padding: 0.4rem 0.3rem 0.2rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .villager-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    text-align: left;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    padding: 0.35rem 0.55rem;
    margin-bottom: 3px;
    cursor: pointer;
    transition: all 0.12s;
  }

  .villager-btn:hover { border-color: var(--blue); }

  .villager-btn.hidden {
    background: var(--removed);
    border-color: #33334a;
    color: #4a4a6a;
  }

  .villager-btn .v-avatar {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.65rem;
    font-weight: 700;
    flex-shrink: 0;
    border: 2px solid transparent;
  }

  .center-panel {
    overflow-y: auto;
    padding: 0.6rem;
    background: #13132a;
  }

  .center-header {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.5rem;
    color: var(--gold);
    padding: 0.5rem 0.5rem 0.8rem;
    letter-spacing: 1px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 0.6rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.4rem;
  }

  .legend {
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
    font-family: 'Nunito', sans-serif;
    font-size: 0.68rem;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 4px;
    color: var(--textdim);
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .villager-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 0.5rem;
    overflow: hidden;
    transition: border-color 0.15s;
  }

  .villager-card.tier-love { border-color: var(--love); }
  .villager-card.tier-like { border-color: var(--like); }
  .villager-card.tier-neutral { border-color: #3a3a5a; }

  .vc-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0.45rem 0.7rem;
  }

  .vc-header .v-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.72rem;
    font-weight: 700;
    flex-shrink: 0;
    border: 2px solid rgba(255,255,255,0.15);
  }

  .vc-name {
    font-weight: 700;
    font-size: 0.9rem;
    flex: 1;
  }

  .vc-tier-badge {
    font-size: 0.65rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .badge-love { background: #ff6b9d33; color: var(--love); border: 1px solid var(--love); }
  .badge-like { background: #ffd16633; color: var(--like); border: 1px solid var(--like); }
  .badge-neutral { background: #6c757d22; color: #8899aa; border: 1px solid #444; }
  .badge-none { background: #33334422; color: #555577; border: 1px solid #33334a; }

  .vc-gifts {
    padding: 0.3rem 0.7rem 0.55rem;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  .gift-pill {
    font-size: 0.72rem;
    padding: 2px 9px;
    border-radius: 12px;
    font-weight: 600;
  }

  .pill-love { background: #ff6b9d22; color: var(--love); border: 1px solid #ff6b9d55; }
  .pill-like { background: #ffd16622; color: #f5c842; border: 1px solid #ffd16655; }
  .pill-neutral { background: #ffffff08; color: var(--muted); border: 1px solid #ffffff15; }

  .no-results {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    padding: 2rem;
    font-style: italic;
  }

  .select-all-wrap {
    padding: 0.3rem 0.6rem;
    display: flex;
    gap: 5px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .mini-btn {
    font-size: 0.65rem;
    background: #0a0a1f;
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--textdim);
    cursor: pointer;
    padding: 2px 7px;
    font-family: 'Nunito', sans-serif;
    font-weight: 600;
    transition: all 0.1s;
  }
  .mini-btn:hover { border-color: var(--gold); color: var(--gold); }

  .count-badge {
    font-size: 0.6rem;
    color: var(--muted);
    margin-left: auto;
    font-style: italic;
  }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2a3a5e; border-radius: 3px; }

  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; height: auto; }
    .panel { max-height: 40vh; border-right: none; border-bottom: 2px solid var(--border); }
    .panel:last-child { border-left: none; border-top: 2px solid var(--border); }
    .stars { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="stars stars-left">⭐🌟</div>
  <h1>Stardew Valley<br>Gift Planner</h1>
  <p>Toggle items you have · Toggle villagers you care about · See the best gifts</p>
  <p style="font-size:0.65rem; color:#556; margin-top:0.4rem; letter-spacing:0.5px;">Made with <a href="https://claude.ai" style="color:#8899aa; text-decoration:none;">Claude</a></p>
  <div class="stars stars-right">🌟⭐</div>
</header>

<div class="layout">
  <!-- LEFT: Items -->
  <div class="panel" id="items-panel">
    <div class="panel-header">
      🎁 Your Items
      <div class="panel-hint">Click to remove from inventory</div>
    </div>
    <div class="search-wrap">
      <input type="text" id="item-search" placeholder="Search items…">
    </div>
    <div class="select-all-wrap">
      <button class="mini-btn" onclick="setAllItems(true)">All in</button>
      <button class="mini-btn" onclick="setAllItems(false)">All out</button>
    </div>
    <div class="item-list" id="item-list"></div>
  </div>

  <!-- CENTER: Results -->
  <div class="center-panel" id="center-panel">
    <div class="center-header">
      <span>Best Matches</span>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:var(--love)"></div> Love</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--like)"></div> Like</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--neutral)"></div> Neutral only</div>
      </div>
    </div>
    <div id="results"></div>
  </div>

  <!-- RIGHT: Villagers -->
  <div class="panel" id="villagers-panel">
    <div class="panel-header">
      👤 Villagers
      <div class="panel-hint">Click to hide/show</div>
    </div>
    <div class="search-wrap">
      <input type="text" id="villager-search" placeholder="Search villagers…">
    </div>
    <div class="select-all-wrap">
      <button class="mini-btn" onclick="setAllVillagers(true)">Show all</button>
      <button class="mini-btn" onclick="setAllVillagers(false)">Hide all</button>
    </div>
    <div class="villager-list" id="villager-list"></div>
  </div>
</div>

// ─── PERSISTENCE ─────────────────────────────────────────────────────────────
function saveState() {
  localStorage.setItem("sdv_removedItems", JSON.stringify([...state.removedItems]));
  localStorage.setItem("sdv_hiddenVillagers", JSON.stringify([...state.hiddenVillagers]));
}

function loadState() {
  try {
    const items = JSON.parse(localStorage.getItem("sdv_removedItems") || "[]");
    const villagers = JSON.parse(localStorage.getItem("sdv_hiddenVillagers") || "[]");
    return { removedItems: new Set(items), hiddenVillagers: new Set(villagers) };
  } catch { return { removedItems: new Set(), hiddenVillagers: new Set() }; }
}

const _saved = loadState();
const state = {
  removedItems: _saved.removedItems,
  hiddenVillagers: _saved.hiddenVillagers,
  itemSearch: "",
  villagerSearch: ""
};

// Build a lookup: item -> preference for each villager
function getPreference(villager, item, vData) {
  const name = villager;
  const v = vData;

  // Check specific villager dislikes/hates first (highest priority negative)
  if (v.hates && v.hates.includes(item)) return "hate";
  if (v.dislikes && v.dislikes.includes(item)) return "dislike";

  // Check specific villager loves/likes (highest priority positive)
  if (v.loves && v.loves.includes(item)) return "love";
  if (v.likes && v.likes.includes(item)) return "like";

  // Universal hate exceptions
  if (v.universalHateExceptions && v.universalHateExceptions.includes(item)) {
    // skip universal hate, continue checking below
  } else if (UNIVERSAL_HATES.includes(item)) return "hate";

  // Universal loves (with exceptions)
  const ulExcept = v.universalLoveExceptions || [];
  if (!ulExcept.includes(item) && UNIVERSAL_LOVES.includes(item)) return "love";

  // Universal dislikes
  if (UNIVERSAL_DISLIKES.includes(item)) return "dislike";

  // Universal likes (with exceptions)
  const uliExcept = v.universalLikeExceptions || [];
  if (!uliExcept.includes(item) && UNIVERSAL_LIKES.includes(item)) return "like";

  return "neutral";
}

// Get best gifts for a villager from available items
function getBestGifts(villagerName, vData) {
  const loves = [], likes = [], neutrals = [];
  const available = getAllItems().filter(i => !state.removedItems.has(i));
  for (const item of available) {
    const pref = getPreference(villagerName, item, vData);
    if (pref === "love") loves.push(item);
    else if (pref === "like") likes.push(item);
    else if (pref === "neutral") neutrals.push(item);
  }
  return { loves, likes, neutrals };
}

function getAllItems() {
  const all = [];
  const seen = new Set();
  for (const items of Object.values(ITEM_CATEGORIES)) {
    for (const item of items) {
      if (!seen.has(item)) { seen.add(item); all.push(item); }
    }
  }
  return all;
}

// ─── RENDER ──────────────────────────────────────────────────────────────────

function renderItems() {
  const list = document.getElementById("item-list");
  const search = state.itemSearch.toLowerCase();
  let html = "";

  for (const [cat, items] of Object.entries(ITEM_CATEGORIES)) {
    const filtered = search ? items.filter(i => i.toLowerCase().includes(search)) : items;
    if (!filtered.length) continue;
    html += `<div class="item-cat">${cat}</div>`;
    for (const item of filtered) {
      const removed = state.removedItems.has(item);
      html += `<button class="item-btn ${removed ? "removed" : ""}" onclick="toggleItem('${item.replace(/'/g,"\\'")}')">
        ${item}
      </button>`;
    }
  }

  if (!html) html = `<div class="no-results">No items match your search</div>`;
  list.innerHTML = html;
}

function renderVillagers() {
  const list = document.getElementById("villager-list");
  const search = state.villagerSearch.toLowerCase();
  const names = Object.keys(VILLAGERS).filter(n => !search || n.toLowerCase().includes(search));
  let html = "";
  for (const name of names) {
    const v = VILLAGERS[name];
    const hidden = state.hiddenVillagers.has(name);
    const initials = name.slice(0,2).toUpperCase();
    html += `<button class="villager-btn ${hidden ? "hidden" : ""}" onclick="toggleVillager('${name}')">
      <div class="v-avatar" style="background:${v.color}22; color:${v.color}; border-color:${v.color}55;">${initials}</div>
      ${name}
    </button>`;
  }
  if (!html) html = `<div class="no-results">No villagers match</div>`;
  list.innerHTML = html;
}

function renderResults() {
  const results = document.getElementById("results");
  const visible = Object.keys(VILLAGERS).filter(n => !state.hiddenVillagers.has(n));

  // Score each villager
  const scored = visible.map(name => {
    const { loves, likes, neutrals } = getBestGifts(name, VILLAGERS[name]);
    let tier = loves.length > 0 ? "love" : likes.length > 0 ? "like" : "neutral";
    return { name, loves, likes, neutrals, tier };
  });

  // Sort: love first, then like, then neutral; within tier alphabetical
  const tierOrder = { love: 0, like: 1, neutral: 2 };
  scored.sort((a, b) => {
    const td = tierOrder[a.tier] - tierOrder[b.tier];
    if (td !== 0) return td;
    return a.name.localeCompare(b.name);
  });

  if (!scored.length) {
    results.innerHTML = `<div class="no-results">No visible villagers. Show some in the right panel!</div>`;
    return;
  }

  let html = "";
  for (const { name, loves, likes, neutrals, tier } of scored) {
    const v = VILLAGERS[name];
    const initials = name.slice(0,2).toUpperCase();
    const tierLabel = tier === "love" ? "♥ LOVES" : tier === "like" ? "★ LIKES" : "· NEUTRAL";
    const badgeClass = `badge-${tier}`;

    let gifts = "";
    for (const item of loves) {
      gifts += `<span class="gift-pill pill-love">♥ ${item}</span>`;
    }
    for (const item of likes) {
      gifts += `<span class="gift-pill pill-like">★ ${item}</span>`;
    }
    if (neutrals.length > 0) {
      gifts += `<span class="gift-pill pill-neutral">· ${neutrals.join("</span><span class=\"gift-pill pill-neutral\">· ")}</span>`;
    }
    if (!gifts) {
      gifts = `<span style="font-size:0.72rem; color:var(--muted); font-style:italic;">No available items</span>`;
    }

    html += `<div class="villager-card tier-${tier}">
      <div class="vc-header">
        <div class="v-avatar" style="background:${v.color}22; color:${v.color}; border-color:${v.color}77;">${initials}</div>
        <div class="vc-name">${name}</div>
        <div class="vc-tier-badge ${badgeClass}">${tierLabel}</div>
      </div>
      <div class="vc-gifts">${gifts}</div>
    </div>`;
  }

  results.innerHTML = html;
}

function render() {
  renderItems();
  renderVillagers();
  renderResults();
}

// ─── ACTIONS ─────────────────────────────────────────────────────────────────

function toggleItem(item) {
  if (state.removedItems.has(item)) state.removedItems.delete(item);
  else state.removedItems.add(item);
  saveState(); render();
}

function toggleVillager(name) {
  if (state.hiddenVillagers.has(name)) state.hiddenVillagers.delete(name);
  else state.hiddenVillagers.add(name);
  saveState(); render();
}

function setAllItems(include) {
  if (include) state.removedItems.clear();
  else getAllItems().forEach(i => state.removedItems.add(i));
  saveState(); render();
}

function setAllVillagers(show) {
  if (show) state.hiddenVillagers.clear();
  else Object.keys(VILLAGERS).forEach(n => state.hiddenVillagers.add(n));
  saveState(); render();
}

document.getElementById("item-search").addEventListener("input", e => {
  state.itemSearch = e.target.value;
  renderItems();
});

document.getElementById("villager-search").addEventListener("input", e => {
  state.villagerSearch = e.target.value;
  renderVillagers();
});

// Initial render
render();
</script>
