<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stardew Gift Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1a0f;
    --panel: #111a11;
    --card: #0f2a0f;
    --accent: #e94560;
    --gold: #f5c842;
    --green: #4caf50;
    --blue: #5bc0eb;
    --purple: #9b5de5;
    --pink: #f15bb5;
    --muted: #7a9a7a;
    --text: #e8e8f0;
    --textdim: #9ab89a;
    --border: #1e3a1e;
    --love: #ff6b9d;
    --like: #ffd166;
    --neutral: #6c757d;
    --dislike: #a0522d;
    --hate: #c0392b;
    --removed: #1a2a1a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  header {
    text-align: center;
    padding: 1.2rem 1rem 0.8rem;
    border-bottom: 2px solid var(--gold);
    background: #0a140a;
    position: relative;
  }

  header h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(0.7rem, 2vw, 1rem);
    color: var(--gold);
    text-shadow: 3px 3px 0 #7a6010, 0 0 20px #f5c84244;
    letter-spacing: 2px;
    line-height: 1.6;
  }

  header p {
    font-size: 0.82rem;
    color: var(--muted);
    margin-top: 0.4rem;
    font-style: italic;
  }

  .stars {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 1.6rem;
  }
  .stars-left { left: 1.5rem; }
  .stars-right { right: 1.5rem; }

  .layout {
    display: grid;
    grid-template-columns: 240px 1fr 240px;
    gap: 0;
    height: calc(100vh - 90px);
  }

  .panel {
    background: var(--panel);
    border-right: 2px solid var(--border);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  .panel:last-child {
    border-right: none;
    border-left: 2px solid var(--border);
  }

  .panel-header {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.52rem;
    color: var(--gold);
    padding: 0.7rem 0.8rem 0.5rem;
    border-bottom: 1px solid var(--border);
    background: #0a140a;
    position: sticky;
    top: 0;
    z-index: 10;
    letter-spacing: 1px;
  }

  .panel-hint {
    font-family: 'Nunito', sans-serif;
    font-size: 0.7rem;
    color: var(--muted);
    font-weight: 400;
    margin-top: 3px;
    letter-spacing: 0;
    font-style: italic;
  }

  .search-wrap {
    padding: 0.5rem 0.6rem;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 52px;
    background: var(--panel);
    z-index: 9;
  }

  .search-wrap input {
    width: 100%;
    background: #091209;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    font-size: 0.78rem;
    padding: 0.35rem 0.5rem;
    outline: none;
  }
  .search-wrap input:focus { border-color: var(--gold); }
  .search-wrap input::placeholder { color: var(--muted); }

  .item-list, .villager-list {
    flex: 1;
    overflow-y: auto;
    padding: 0.4rem;
  }

  .item-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    font-size: 0.76rem;
    padding: 0.3rem 0.5rem;
    margin-bottom: 3px;
    cursor: pointer;
    transition: all 0.12s;
    position: relative;
  }

  .item-btn:hover { border-color: var(--gold); background: #0f2a10; }

  .item-btn.removed {
    background: var(--removed);
    border-color: #33334a;
    color: #4a4a6a;
    text-decoration: line-through;
  }

  .item-btn .item-emoji {
    margin-right: 4px;
  }

  .item-cat {
    font-size: 0.6rem;
    color: var(--muted);
    font-family: 'Press Start 2P', monospace;
    padding: 0.4rem 0.3rem 0.2rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .villager-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    text-align: left;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    padding: 0.35rem 0.55rem;
    margin-bottom: 3px;
    cursor: pointer;
    transition: all 0.12s;
  }

  .villager-btn:hover { border-color: var(--green); }

  .villager-btn.hidden {
    background: var(--removed);
    border-color: #33334a;
    color: #4a4a6a;
  }

  .villager-btn .v-avatar {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.65rem;
    font-weight: 700;
    flex-shrink: 0;
    border: 2px solid transparent;
  }

  .center-panel {
    overflow-y: auto;
    padding: 0.6rem;
    background: #0c180c;
  }

  .center-header {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.5rem;
    color: var(--gold);
    padding: 0.5rem 0.5rem 0.8rem;
    letter-spacing: 1px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 0.6rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.4rem;
  }

  .legend {
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
    font-family: 'Nunito', sans-serif;
    font-size: 0.68rem;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 4px;
    color: var(--textdim);
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .villager-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 0.5rem;
    overflow: hidden;
    transition: border-color 0.15s;
  }

  .villager-card.tier-love { border-color: var(--love); }
  .villager-card.tier-like { border-color: var(--like); }
  .villager-card.tier-neutral { border-color: #3a3a5a; }

  .vc-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0.45rem 0.7rem;
  }

  .vc-header .v-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.72rem;
    font-weight: 700;
    flex-shrink: 0;
    border: 2px solid rgba(255,255,255,0.15);
  }

  .vc-name {
    font-weight: 700;
    font-size: 0.9rem;
    flex: 1;
  }

  .vc-tier-badge {
    font-size: 0.65rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .badge-love { background: #ff6b9d33; color: var(--love); border: 1px solid var(--love); }
  .badge-like { background: #ffd16633; color: var(--like); border: 1px solid var(--like); }
  .badge-neutral { background: #6c757d22; color: #8899aa; border: 1px solid #444; }
  .badge-none { background: #33334422; color: #555577; border: 1px solid #33334a; }

  .vc-gifts {
    padding: 0.3rem 0.7rem 0.55rem;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  .gift-pill {
    font-size: 0.72rem;
    padding: 2px 9px;
    border-radius: 12px;
    font-weight: 600;
  }

  .pill-love { background: #ff6b9d22; color: var(--love); border: 1px solid #ff6b9d55; }
  .pill-like { background: #ffd16622; color: #f5c842; border: 1px solid #ffd16655; }
  .pill-neutral { background: #ffffff08; color: var(--muted); border: 1px solid #ffffff15; }

  .no-results {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    padding: 2rem;
    font-style: italic;
  }

  .select-all-wrap {
    padding: 0.3rem 0.6rem;
    display: flex;
    gap: 5px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .mini-btn {
    font-size: 0.65rem;
    background: #091209;
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--textdim);
    cursor: pointer;
    padding: 2px 7px;
    font-family: 'Nunito', sans-serif;
    font-weight: 600;
    transition: all 0.1s;
  }
  .mini-btn:hover { border-color: var(--gold); color: var(--gold); }

  .count-badge {
    font-size: 0.6rem;
    color: var(--muted);
    margin-left: auto;
    font-style: italic;
  }

  .slot-bar-panel {
    border-bottom: 1px solid var(--border);
    padding: 0.35rem 0.5rem;
    background: #0a150a;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .slot-bar-row {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
  }
  .slot-bar-label {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.42rem;
    color: var(--muted);
    letter-spacing: 1px;
    flex-shrink: 0;
  }
  /* Save slot bar */
  .slot-btn {
    font-family: 'Nunito', sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    background: #091209;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--textdim);
    cursor: pointer;
    padding: 2px 9px;
    transition: all 0.12s;
    white-space: nowrap;
  }
  .slot-btn:hover { border-color: var(--gold); color: var(--gold); }
  .slot-btn.slot-active { background: #0a220a; border-color: var(--gold); color: var(--gold); }

  /* Item and villager rows with priority button */
  .select-all-wrap { flex-wrap: wrap; gap: 4px; }
  .view-btn.active-view { border-color: var(--gold); color: var(--gold); background: #0a220a; }
  .item-row {
    display: flex; align-items: center; gap: 3px; margin-bottom: 3px;
  }
  .item-row .item-btn {
    flex: 1; margin-bottom: 0;
    display: flex; align-items: center; justify-content: space-between; gap: 4px;
  }
  .item-name { flex: 1; }
  .item-stats { font-size: 0.65rem; display: flex; gap: 3px; flex-shrink: 0; }

  .villager-row {
    display: flex; align-items: center; gap: 3px; margin-bottom: 3px;
  }
  .villager-row .villager-btn { flex: 1; margin-bottom: 0; }

  .priority-btn {
    flex-shrink: 0; width: 24px; height: 24px;
    background: #091209; border: 1px solid var(--border); border-radius: 4px;
    color: #3a3a5a; font-size: 0.75rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.12s; padding: 0; line-height: 1;
  }
  .priority-btn:hover { border-color: var(--gold); color: var(--gold); }
  .priority-btn.active { background: #2a2200; border-color: var(--gold); color: var(--gold); }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2a3a5e; border-radius: 3px; }

  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; height: auto; }
    .panel { max-height: 40vh; border-right: none; border-bottom: 2px solid var(--border); }
    .panel:last-child { border-left: none; border-top: 2px solid var(--border); }
    .stars { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="stars stars-left">⭐🌟</div>
  <h1>Stardew Valley<br>Gift Planner</h1>
  <p>Toggle items you have · Toggle villagers you care about · See the best gifts</p>
  <p style="font-size:0.55rem; color:#344; margin-top:0.35rem; letter-spacing:0.3px;">Made with <a href="https://claude.ai" style="color:#4a7755; text-decoration:none;">Claude</a></p>
  <div class="stars stars-right">🌟⭐</div>
</header>

<div class="layout">
  <!-- LEFT: Items -->
  <div class="panel" id="items-panel">
    <div class="panel-header">
      🎁 Your Items
      <div class="panel-hint">Click to remove from inventory</div>
    </div>
    <div class="search-wrap">
      <input type="text" id="item-search" placeholder="Search items…">
    </div>
    <div class="select-all-wrap">
      <button class="mini-btn" onclick="setAllItems(true)">All in</button>
      <button class="mini-btn" onclick="setAllItems(false)">All out</button>
      <span style="flex:1"></span>
      <button class="mini-btn view-btn" id="view-cat"   onclick="setItemView('category')"  title="Group by category">≡ Cat</button>
      <button class="mini-btn view-btn" id="view-alpha" onclick="setItemView('alpha')"     title="Alphabetical">A–Z</button>
      <button class="mini-btn view-btn" id="view-smart" onclick="setItemView('smart')"     title="Owned &amp; priority first">★ Smart</button>
    </div>
    <div id="item-slot-bar" class="slot-bar-panel"></div>
    <div class="item-list" id="item-list"></div>
  </div>

  <!-- CENTER: Results -->
  <div class="center-panel" id="center-panel">
    <div class="center-header">
      <span>Best Matches</span>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:var(--love)"></div> Love</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--like)"></div> Like</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--neutral)"></div> Neutral only</div>
      </div>
    </div>
    <div id="results"></div>
  </div>

  <!-- RIGHT: Villagers -->
  <div class="panel" id="villagers-panel">
    <div class="panel-header">
      👤 Villagers
      <div class="panel-hint">Click to hide/show</div>
    </div>
    <div class="search-wrap">
      <input type="text" id="villager-search" placeholder="Search villagers…">
    </div>
    <div class="select-all-wrap">
      <button class="mini-btn" onclick="setAllVillagers(true)">Show all</button>
      <button class="mini-btn" onclick="setAllVillagers(false)">Hide all</button>
    </div>
    <div id="villager-slot-bar" class="slot-bar-panel"></div>
    <div class="villager-list" id="villager-list"></div>
  </div>
</div>

  catch { return []; }
}
function saveSideSlots(key, arr) { localStorage.setItem(key, JSON.stringify(arr)); }

let itemSlots     = loadSideSlots("sdv_item_slots");
let villagerSlots = loadSideSlots("sdv_villager_slots");
let activeItemSlot     = Math.min(parseInt(localStorage.getItem("sdv_active_item_slot")     ?? "-1"), itemSlots.length     - 1);
let activeVillagerSlot = Math.min(parseInt(localStorage.getItem("sdv_active_villager_slot") ?? "-1"), villagerSlots.length - 1);

const state = {
  removedItems: new Set(), hiddenVillagers: new Set(),
  priorityItems: new Set(), priorityVillagers: new Set(),
  itemSearch: "", villagerSearch: "",
  itemView: localStorage.getItem("sdv_item_view") || "category"
};

function applyItemSlot(idx) {
  if (idx < 0 || idx >= itemSlots.length) return;
  const s = itemSlots[idx];
  state.removedItems  = new Set(s.removedItems  || []);
  state.priorityItems = new Set(s.priorityItems || []);
}
function applyVillagerSlot(idx) {
  if (idx < 0 || idx >= villagerSlots.length) return;
  const s = villagerSlots[idx];
  state.hiddenVillagers   = new Set(s.hiddenVillagers   || []);
  state.priorityVillagers = new Set(s.priorityVillagers || []);
}
function syncItemSlot() {
  if (activeItemSlot < 0) return;
  itemSlots[activeItemSlot] = { ...itemSlots[activeItemSlot],
    removedItems: [...state.removedItems], priorityItems: [...state.priorityItems] };
  saveSideSlots("sdv_item_slots", itemSlots);
}
function syncVillagerSlot() {
  if (activeVillagerSlot < 0) return;
  villagerSlots[activeVillagerSlot] = { ...villagerSlots[activeVillagerSlot],
    hiddenVillagers: [...state.hiddenVillagers], priorityVillagers: [...state.priorityVillagers] };
  saveSideSlots("sdv_villager_slots", villagerSlots);
}
function switchItemSlot(idx) {
  activeItemSlot = idx;
  localStorage.setItem("sdv_active_item_slot", idx);
  applyItemSlot(idx); render();
}
function switchVillagerSlot(idx) {
  activeVillagerSlot = idx;
  localStorage.setItem("sdv_active_villager_slot", idx);
  applyVillagerSlot(idx); render();
}
function addItemSlot() {
  itemSlots.push({ name: "Slot " + (itemSlots.length + 1), removedItems: [], priorityItems: [] });
  saveSideSlots("sdv_item_slots", itemSlots);
  switchItemSlot(itemSlots.length - 1);
}
function addVillagerSlot() {
  villagerSlots.push({ name: "Slot " + (villagerSlots.length + 1), hiddenVillagers: [], priorityVillagers: [] });
  saveSideSlots("sdv_villager_slots", villagerSlots);
  switchVillagerSlot(villagerSlots.length - 1);
}
function renameItemSlot(name) {
  if (activeItemSlot < 0) return;
  itemSlots[activeItemSlot].name = name || ("Slot " + (activeItemSlot + 1));
  saveSideSlots("sdv_item_slots", itemSlots);
  renderItemSlotBar();
}
function renameVillagerSlot(name) {
  if (activeVillagerSlot < 0) return;
  villagerSlots[activeVillagerSlot].name = name || ("Slot " + (activeVillagerSlot + 1));
  saveSideSlots("sdv_villager_slots", villagerSlots);
  renderVillagerSlotBar();
}
function deleteItemSlot() {
  if (activeItemSlot < 0) return;
  itemSlots.splice(activeItemSlot, 1);
  saveSideSlots("sdv_item_slots", itemSlots);
  state.removedItems.clear(); state.priorityItems.clear();
  activeItemSlot = itemSlots.length ? Math.min(activeItemSlot, itemSlots.length - 1) : -1;
  localStorage.setItem("sdv_active_item_slot", activeItemSlot);
  if (activeItemSlot >= 0) applyItemSlot(activeItemSlot);
  render();
}
function deleteVillagerSlot() {
  if (activeVillagerSlot < 0) return;
  villagerSlots.splice(activeVillagerSlot, 1);
  saveSideSlots("sdv_villager_slots", villagerSlots);
  state.hiddenVillagers.clear(); state.priorityVillagers.clear();
  activeVillagerSlot = villagerSlots.length ? Math.min(activeVillagerSlot, villagerSlots.length - 1) : -1;
  localStorage.setItem("sdv_active_villager_slot", activeVillagerSlot);
  if (activeVillagerSlot >= 0) applyVillagerSlot(activeVillagerSlot);
  render();
}

applyItemSlot(activeItemSlot);
applyVillagerSlot(activeVillagerSlot);

// ─── PREFERENCE LOGIC ────────────────────────────────────────────────────────

function getPreference(villager, item, vData) {
  const v = vData;
  if (v.hates    && v.hates.includes(item))    return "hate";
  if (v.dislikes && v.dislikes.includes(item)) return "dislike";
  if (v.loves    && v.loves.includes(item))    return "love";
  if (v.likes    && v.likes.includes(item))    return "like";
  if (v.neutral  && v.neutral.includes(item))  return "neutral";
  if (UNIVERSAL_HATES.includes(item))    return "hate";
  if (UNIVERSAL_LOVES.includes(item))    return "love";
  if (UNIVERSAL_DISLIKES.includes(item)) return "dislike";
  if (UNIVERSAL_LIKES.includes(item))    return "like";
  if (UNIVERSAL_NEUTRALS.includes(item)) return "neutral";
  return "error";
}

function buildItemStats() {
  const stats = {};
  for (const item of getAllItems()) {
    let love = 0, like = 0, neutral = 0;
    for (const [name, v] of Object.entries(VILLAGERS)) {
      const p = getPreference(name, item, v);
      if (p === "love") love++;
      else if (p === "like") like++;
      else if (p === "neutral") neutral++;
    }
    stats[item] = { love, like, neutral };
  }
  return stats;
}
let ITEM_STATS = {};

function getBestGifts(villagerName, vData) {
  const loves = [], likes = [], neutrals = [];
  for (const item of getAllItems()) {
    if (state.removedItems.has(item)) continue;
    const p = getPreference(villagerName, item, vData);
    if (p === "love") loves.push(item);
    else if (p === "like") likes.push(item);
    else if (p === "neutral") neutrals.push(item);
  }
  const sort = arr => [...arr.filter(i => state.priorityItems.has(i)).sort(),
                       ...arr.filter(i => !state.priorityItems.has(i)).sort()];
  return { loves: sort(loves), likes: sort(likes), neutrals: sort(neutrals) };
}

function getAllItems() {
  const all = [], seen = new Set();
  for (const items of Object.values(ITEM_CATEGORIES))
    for (const item of items)
      if (!seen.has(item)) { seen.add(item); all.push(item); }
  return all;
}

// ─── RENDER ──────────────────────────────────────────────────────────────────

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function renderSlotBar(containerId, slots, activeIdx, switchFn, addFn, renameFn, deleteFn) {
  const bar = document.getElementById(containerId);
  if (!bar) return;
  let html = '<div class="slot-bar-row"><span class="slot-bar-label">SAVE</span>';
  for (let i = 0; i < slots.length; i++)
    html += '<button onclick="' + switchFn + '(' + i + ')" class="slot-btn' + (i === activeIdx ? ' slot-active' : '') + '">' + esc(slots[i].name) + '</button>';
  html += '<button onclick="' + addFn + '()" class="slot-btn" style="color:var(--gold);border-color:#1a3a1a;" title="New slot">＋</button></div>';
  if (activeIdx >= 0 && activeIdx < slots.length)
    html += '<div class="slot-bar-row"><input type="text" value="' + esc(slots[activeIdx].name) + '" onchange="' + renameFn + '(this.value)" maxlength="20" style="flex:1;min-width:0;background:#091209;border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:\'Nunito\',sans-serif;font-size:0.72rem;padding:2px 6px;outline:none;" placeholder="Slot name\u2026"><button onclick="' + deleteFn + '()" class="slot-btn" style="color:#c0392b;border-color:#5a2a2a;flex-shrink:0;" title="Delete">\u2715</button></div>';
  bar.innerHTML = html;
}

function renderItemSlotBar()     { renderSlotBar("item-slot-bar",     itemSlots,     activeItemSlot,     "switchItemSlot",     "addItemSlot",     "renameItemSlot",     "deleteItemSlot");     }
function renderVillagerSlotBar() { renderSlotBar("villager-slot-bar", villagerSlots, activeVillagerSlot, "switchVillagerSlot", "addVillagerSlot", "renameVillagerSlot", "deleteVillagerSlot"); }

function itemPill(item) {
  const removed = state.removedItems.has(item);
  const priority = state.priorityItems.has(item);
  const st = ITEM_STATS[item] || { love:0, like:0, neutral:0 };
  const statParts = [
    st.love    > 0 ? '<span style="color:var(--love)">\u2665' + st.love    + '</span>' : '',
    st.like    > 0 ? '<span style="color:var(--like)">\u2605' + st.like    + '</span>' : '',
    st.neutral > 0 ? '<span style="color:var(--muted)">\u00b7' + st.neutral + '</span>' : '',
  ].filter(Boolean).join(' ');
  const e = item.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  return '<div class="item-row' + (removed ? ' removed' : '') + '">'
    + '<button class="item-btn' + (removed ? ' removed' : '') + '" onclick="toggleItem(\'' + e + '\')">'
    + '<span class="item-name">' + item + '</span>'
    + '<span class="item-stats">' + statParts + '</span></button>'
    + '<button class="priority-btn' + (priority ? ' active' : '') + '" onclick="togglePriorityItem(\'' + e + '\')" title="Priority">\u2605</button>'
    + '</div>';
}

function setItemView(mode) {
  state.itemView = mode;
  localStorage.setItem("sdv_item_view", mode);
  renderItems();
}

function renderItems() {
  const list = document.getElementById("item-list");
  const search = state.itemSearch.toLowerCase();

  // Update active view button highlight
  ['category','alpha','smart'].forEach(m => {
    const btn = document.getElementById('view-' + m);
    if (btn) btn.classList.toggle('active-view', state.itemView === m);
  });

  const allItems = getAllItems().filter(i => !search || i.toLowerCase().includes(search));
  if (!allItems.length) { list.innerHTML = '<div class="no-results">No items match your search</div>'; return; }

  let html = '';

  if (state.itemView === 'alpha') {
    const sorted = [...allItems].sort((a,b) => a.localeCompare(b));
    for (const item of sorted) html += itemPill(item);

  } else if (state.itemView === 'smart') {
    // owned+priority > owned > priority > neither
    const groups = [[],[],[],[]];
    for (const item of allItems) {
      const owned    = !state.removedItems.has(item);
      const priority = state.priorityItems.has(item);
      if (owned && priority)   groups[0].push(item);
      else if (owned)          groups[1].push(item);
      else if (priority)       groups[2].push(item);
      else                     groups[3].push(item);
    }
    const labels = ['\u2b50 Owned & Priority', '\u2713 Owned', '\u2605 Priority (not owned)', '\u00b7 Other'];
    for (let g = 0; g < 4; g++) {
      if (!groups[g].length) continue;
      groups[g].sort((a,b) => a.localeCompare(b));
      html += '<div class="item-cat">' + labels[g] + '</div>';
      for (const item of groups[g]) html += itemPill(item);
    }

  } else {
    // Category view (default)
    for (const [cat, items] of Object.entries(ITEM_CATEGORIES)) {
      const filtered = search ? items.filter(i => i.toLowerCase().includes(search)) : items;
      if (!filtered.length) continue;
      html += '<div class="item-cat">' + cat + '</div>';
      for (const item of filtered) html += itemPill(item);
    }
  }

  list.innerHTML = html;
}

function renderVillagers() {
  const list = document.getElementById("villager-list");
  const search = state.villagerSearch.toLowerCase();
  const names = Object.keys(VILLAGERS).filter(n => !search || n.toLowerCase().includes(search));
  let html = "";
  for (const name of names) {
    const v = VILLAGERS[name];
    const hidden = state.hiddenVillagers.has(name);
    const priority = state.priorityVillagers.has(name);
    const initials = name.slice(0,2).toUpperCase();
    html += '<div class="villager-row' + (hidden ? ' hidden' : '') + '"><button class="villager-btn' + (hidden ? ' hidden' : '') + '" onclick="toggleVillager(\'' + name + '\')"><div class="v-avatar" style="background:' + v.color + '22;color:' + v.color + ';border-color:' + v.color + '55;">' + initials + '</div>' + name + '</button><button class="priority-btn' + (priority ? ' active' : '') + '" onclick="togglePriorityVillager(\'' + name + '\')" title="Priority">\u2605</button></div>';
  }
  if (!html) html = '<div class="no-results">No villagers match</div>';
  list.innerHTML = html;
}

function renderResults() {
  const results = document.getElementById("results");
  const visible = Object.keys(VILLAGERS).filter(n => !state.hiddenVillagers.has(n));
  const scored = visible.map(name => {
    const { loves, likes, neutrals } = getBestGifts(name, VILLAGERS[name]);
    const pv = state.priorityVillagers.has(name);
    const pl = loves.some(i    => state.priorityItems.has(i));
    const pk = likes.some(i    => state.priorityItems.has(i));
    const pn = neutrals.some(i => state.priorityItems.has(i));
    let score;
    if      (loves.length    && pl && pv) score = 0;
    else if (loves.length    && pl)       score = 1;
    else if (loves.length    && pv)       score = 2;
    else if (loves.length)                score = 3;
    else if (likes.length    && pk && pv) score = 4;
    else if (likes.length    && pk)       score = 5;
    else if (likes.length    && pv)       score = 6;
    else if (likes.length)                score = 7;
    else if (neutrals.length && pn && pv) score = 8;
    else if (neutrals.length && pn)       score = 9;
    else if (neutrals.length && pv)       score = 10;
    else if (neutrals.length)             score = 11;
    else                                  score = 12;
    const tier = loves.length ? "love" : likes.length ? "like" : neutrals.length ? "neutral" : "none";
    return { name, loves, likes, neutrals, tier, score, pv };
  });
  scored.sort((a, b) => a.score !== b.score ? a.score - b.score : a.name.localeCompare(b.name));
  if (!scored.length) { results.innerHTML = '<div class="no-results">No visible villagers.</div>'; return; }
  let html = "";
  for (const { name, loves, likes, neutrals, tier, pv } of scored) {
    const v = VILLAGERS[name];
    const initials = name.slice(0,2).toUpperCase();
    const tierLabel = tier === "love" ? "\u2665 LOVES" : tier === "like" ? "\u2605 LIKES" : tier === "neutral" ? "\u00b7 NEUTRAL" : "\u2717 NONE";
    const priorityMark = pv ? ' <span style="color:var(--gold);font-size:0.7rem;">\u2605</span>' : '';
    const makePills = (arr, cls, prefix) => arr.map(item => {
      const star = state.priorityItems.has(item) ? '<span style="color:var(--gold)">\u2605</span> ' : '';
      return '<span class="gift-pill ' + cls + '">' + prefix + star + item + '</span>';
    }).join('');
    let gifts = makePills(loves, "pill-love", "\u2665 ") + makePills(likes, "pill-like", "\u2605 ") + makePills(neutrals, "pill-neutral", "\u00b7 ");
    if (!gifts) gifts = '<span style="font-size:0.72rem;color:var(--muted);font-style:italic;">No available items</span>';
    html += '<div class="villager-card tier-' + tier + '"><div class="vc-header"><div class="v-avatar" style="background:' + v.color + '22;color:' + v.color + ';border-color:' + v.color + '77;">' + initials + '</div><div class="vc-name">' + name + priorityMark + '</div><div class="vc-tier-badge badge-' + tier + '">' + tierLabel + '</div></div><div class="vc-gifts">' + gifts + '</div></div>';
  }
  results.innerHTML = html;
}

function render() {
  ITEM_STATS = buildItemStats();
  renderItemSlotBar(); renderVillagerSlotBar();
  renderItems(); renderVillagers(); renderResults();
}

// ─── ACTIONS ─────────────────────────────────────────────────────────────────

function toggleItem(item)          { state.removedItems.has(item)      ? state.removedItems.delete(item)      : state.removedItems.add(item);      syncItemSlot();     render(); }
function toggleVillager(name)      { state.hiddenVillagers.has(name)   ? state.hiddenVillagers.delete(name)   : state.hiddenVillagers.add(name);   syncVillagerSlot(); render(); }
function togglePriorityItem(item)  { state.priorityItems.has(item)     ? state.priorityItems.delete(item)     : state.priorityItems.add(item);     syncItemSlot();     render(); }
function togglePriorityVillager(n) { state.priorityVillagers.has(n)    ? state.priorityVillagers.delete(n)    : state.priorityVillagers.add(n);    syncVillagerSlot(); render(); }
function setAllItems(include)      { include ? state.removedItems.clear() : getAllItems().forEach(i => state.removedItems.add(i)); syncItemSlot();     render(); }
function setAllVillagers(show)     { show    ? state.hiddenVillagers.clear() : Object.keys(VILLAGERS).forEach(n => state.hiddenVillagers.add(n));    syncVillagerSlot(); render(); }

document.getElementById("item-search").addEventListener("input",     e => { state.itemSearch     = e.target.value; renderItems();    });
document.getElementById("villager-search").addEventListener("input", e => { state.villagerSearch = e.target.value; renderVillagers(); });

render();

</script>
</body>
